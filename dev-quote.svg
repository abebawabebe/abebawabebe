
<svg xmlns="http://www.w3.org/2000/svg"
     width="800" height="230"
     viewBox="0 0 800 230">

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#211F32"/>
      <stop offset="100%" stop-color="#151923"/>
    </linearGradient>
  </defs>

  <rect width="800" height="230" rx="18"
        fill="url(#background)"/>

  <text x="35" y="55"
        font-size="45"
        fill="#55CDBB">❝</text>

  <text x="400" y="105"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="25"
        font-style="italic"
        font-weight="bold"
        fill="#55CDBB">
    <tspan x="400" dy="0">Code is like humor. When you have to</tspan>
    <tspan x="400" dy="38">explain it, it's bad.</tspan>
  </text>

  <line x1="40" y1="175" x2="760" y2="175"
        stroke="#414151" stroke-width="1"/>

  <text x="750" y="207"
        text-anchor="end"
        font-family="Arial, sans-serif"
        font-size="19"
        font-style="italic"
        fill="#A9A9C9">— Cory House</text>

</svg>
